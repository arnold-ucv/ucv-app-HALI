name: Android release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Flutter project
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'Use a tag such as v1.0.1.' >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          if (( major > 2000 || minor > 999 || patch > 999 )); then
            echo 'Version components exceed the supported Android version code.' >&2
            exit 1
          fi
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( code < 1 || code > 2100000000 )); then
            echo 'Invalid Android version code.' >&2
            exit 1
          fi
          echo "name=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Verify web compilation
        run: flutter build web --release --dart-define=FIREBASE_ENABLED=true

  build_android:
    name: Build signed Android APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HALI_KEYSTORE_BASE64: ${{ secrets.HALI_KEYSTORE_BASE64 }}
      HALI_STORE_PASSWORD: ${{ secrets.HALI_STORE_PASSWORD }}
      HALI_KEY_PASSWORD: ${{ secrets.HALI_KEY_PASSWORD }}
      HALI_KEY_ALIAS: ${{ secrets.HALI_KEY_ALIAS }}
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore Android signing key
        shell: bash
        run: |
          for name in HALI_KEYSTORE_BASE64 HALI_STORE_PASSWORD HALI_KEY_PASSWORD HALI_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
          echo "$HALI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hali-release.jks"
          echo "HALI_KEYSTORE_PATH=$RUNNER_TEMP/hali-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_ENABLED=true
          --build-name=${{ needs.verify.outputs.version_name }}
          --build-number=${{ needs.verify.outputs.version_code }}
      - name: Name APK
        shell: bash
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/HALI-$TAG_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HALI-Android-${{ github.event.release.tag_name }}
          path: build/app/outputs/flutter-apk/HALI-*.apk
          if-no-files-found: error
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$TAG_NAME" "build/app/outputs/flutter-apk/HALI-$TAG_NAME.apk" --clobber
